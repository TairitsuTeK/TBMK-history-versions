name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make nasm gcc-multilib binutils \
            grub-pc-bin grub-common xorriso mtools zip

      - name: Build all versions and pack release
        run: make release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbmk-images
          path: |
            dist/tbmk-images.zip
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TBMK build ${{ github.run_number }}
          body: |
            Automated build of every TBMK history version.

            - Commit: `${{ github.sha }}`
            - Contents: 76 bootable floppy images (`.img`), 2 GRUB ISOs, per-version `kernel.elf`, and `BUILD-INFO.txt`
          files: |
            dist/tbmk-images.zip
            dist/BUILD-INFO.txt
          fail_on_unmatched_files: true
