name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make nasm gcc-multilib binutils \
            grub-pc-bin grub-common xorriso mtools zip

      - name: Build all versions
        run: make

      - name: Publish one release per version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r slug path tag title doc prerelease; do
            [ -n "$tag" ] || continue

            assets=()
            while IFS= read -r file; do
              assets+=("$file")
            done < <(find "dist/$slug" -maxdepth 1 -type f \
              \( -name '*.img' -o -name '*.iso' -o -name 'kernel.elf' \) | sort)

            src="dist/${slug}-src.zip"
            rm -f "$src"
            zip -q -r "$src" "$path"

            files=("${assets[@]}" "$src" "$doc")
            pre_args=()
            [ "$prerelease" = "1" ] && pre_args+=(--prerelease)

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
              gh release edit "$tag" --title "$title" --notes-file "$doc"
            else
              gh release create "$tag" "${files[@]}" \
                --title "$title" --notes-file "$doc" "${pre_args[@]}"
            fi

            # Keep the flag authoritative on updates too; Beta/Gamma/Delta
            # releases are test builds and must never become "Latest".
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
            if [ "$prerelease" = "1" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F prerelease=true >/dev/null
            else
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F prerelease=false >/dev/null
            fi

            printf 'released %s (prerelease=%s)\n' "$tag" "$prerelease"
            sleep 1
          done < releases.tsv
