name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make nasm gcc-multilib binutils \
            grub-pc-bin grub-common xorriso mtools zip

      - name: Build all versions
        run: make

      - name: Publish one release per version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r slug path tag title doc; do
            [ -n "$tag" ] || continue

            assets=()
            while IFS= read -r file; do
              assets+=("$file")
            done < <(find "dist/$slug" -maxdepth 1 -type f \
              \( -name '*.img' -o -name '*.iso' -o -name 'kernel.elf' \) | sort)

            src="dist/${slug}-src.zip"
            rm -f "$src"
            zip -q -r "$src" "$path"

            files=("${assets[@]}" "$src" "$doc")

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
              gh release edit "$tag" --title "$title" --notes-file "$doc"
            else
              gh release create "$tag" "${files[@]}" \
                --title "$title" --notes-file "$doc"
            fi
            printf 'released %s\n' "$tag"
            sleep 1
          done < releases.tsv
